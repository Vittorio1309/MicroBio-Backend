
services:
  postgres:
    image: postgres:16
    container_name: microbio-db
    environment:
      POSTGRES_DB: microbio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: microbio-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microbio
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: microbio-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    depends_on:
      - postgres

volumes:
  postgres_data:
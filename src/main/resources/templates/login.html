<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MicroBio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-container p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .form-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .login-info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            color: #666;
        }

        .login-info h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .login-info p {
            margin: 5px 0;
        }

        .credentials {
            background: #f0f0f0;
            padding: 8px;
            border-radius: 3px;
            font-family: monospace;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 MicroBio</h1>
        <p class="subtitle">Sistema de Orçamentos</p>

        <!-- Mensagem de erro -->
        <div th:if="${param.error}" class="alert error">
            ❌ Usuário ou senha incorretos. Tente novamente.
        </div>

        <!-- Mensagem de logout -->
        <div th:if="${param.logout}" class="alert success">
            ✓ Você foi desconectado com sucesso.
        </div>

        <!-- Formulário de login -->
        <form method="POST" th:action="@{/login}">
            <div class="form-group">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
            </div>

            <div class="form-group">
                <button type="submit">Entrar</button>
            </div>
        </form>

        <!-- Informações de login para teste -->
        <div class="login-info">
            <h4>📝 Credenciais de Teste:</h4>
            <p><strong>Admin:</strong></p>
            <div class="credentials">
                Usuário: admin<br>
                Senha: admin123
            </div>
            <p style="margin-top: 10px;"><strong>Usuário comum:</strong></p>
            <div class="credentials">
                Usuário: user<br>
                Senha: user123
            </div>
        </div>
    </div>
</body>
</html>
